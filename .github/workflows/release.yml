name: Release

# Builds installable artifacts and publishes a GitHub Release.
# Invoked by:
#   - workflow_call from "Publish release" (main version bumps) — preferred
#   - workflow_dispatch (manual retry when a tag exists but the release failed)
#   - push of a v* tag created outside Actions (human / PAT)
# Do not rely on GITHUB_TOKEN tag pushes to chain workflows (GitHub suppresses that).

on:
  workflow_call:
    inputs:
      version:
        description: "Semver without leading v (e.g. 0.4.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Semver without leading v (e.g. 0.4.0). Tag vX.Y.Z must already exist."
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.7"

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Resolve version and tag
        id: meta
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$VERSION' (expected X.Y.Z)"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing version=${VERSION} tag=v${VERSION}"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.meta.outputs.tag }}
      - name: Check tag against pubspec and CHANGELOG
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          if ! grep -Eq "^version: ${VERSION}(\+[0-9]+)?$" pubspec.yaml; then
            echo "::error::pubspec.yaml version does not match v${VERSION}"
            exit 1
          fi
          if ! grep -q "## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section"
            exit 1
          fi

  test:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test

  build-android:
    needs: [verify, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Decode Android release keystore
        env:
          AYUTAM_ANDROID_KEYSTORE_BASE64: ${{ secrets.AYUTAM_ANDROID_KEYSTORE_BASE64 }}
          AYUTAM_ANDROID_KEY_ALIAS: ${{ secrets.AYUTAM_ANDROID_KEY_ALIAS }}
          AYUTAM_ANDROID_STORE_PASSWORD: ${{ secrets.AYUTAM_ANDROID_STORE_PASSWORD }}
          AYUTAM_ANDROID_KEY_PASSWORD: ${{ secrets.AYUTAM_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${AYUTAM_ANDROID_KEYSTORE_BASE64}" ] || \
             [ -z "${AYUTAM_ANDROID_KEY_ALIAS}" ] || \
             [ -z "${AYUTAM_ANDROID_STORE_PASSWORD}" ] || \
             [ -z "${AYUTAM_ANDROID_KEY_PASSWORD}" ]; then
            echo "::error::Missing Android signing secrets (AYUTAM_ANDROID_KEYSTORE_BASE64, AYUTAM_ANDROID_KEY_ALIAS, AYUTAM_ANDROID_STORE_PASSWORD, AYUTAM_ANDROID_KEY_PASSWORD)."
            exit 1
          fi
          echo "$AYUTAM_ANDROID_KEYSTORE_BASE64" | base64 -d > android/ayutam-release.jks
          {
            echo "storePassword=${AYUTAM_ANDROID_STORE_PASSWORD}"
            echo "keyPassword=${AYUTAM_ANDROID_KEY_PASSWORD}"
            echo "keyAlias=${AYUTAM_ANDROID_KEY_ALIAS}"
            echo "storeFile=ayutam-release.jks"
          } > android/key.properties
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release --split-per-abi
      - name: Rename artifacts
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            "dist/ayutam-v${VERSION}-android-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "dist/ayutam-v${VERSION}-android-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
            "dist/ayutam-v${VERSION}-android-x86_64.apk"
          ls -la dist
      - name: Scrub signing materials
        if: always()
        run: |
          rm -f android/ayutam-release.jks android/key.properties
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/ayutam-*.apk
          if-no-files-found: error

  build-linux:
    needs: [verify, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev dpkg-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build linux --release
      - name: Package tarball and .deb
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          mkdir -p dist
          tar -czf "dist/ayutam-v${VERSION}-linux-x64.tar.gz" \
            -C build/linux/x64/release/bundle .
          chmod +x tool/package_linux_deb.sh
          tool/package_linux_deb.sh "${VERSION}" build/linux/x64/release/bundle
          cp "dist/linux/ayutam-v${VERSION}-linux-amd64.deb" dist/
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dist/ayutam-*-linux-x64.tar.gz
            dist/ayutam-*-linux-amd64.deb
          if-no-files-found: error

  build-windows:
    needs: [verify, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build windows --release
      - name: Portable zip
        shell: pwsh
        run: |
          $version = "${{ needs.verify.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath "dist\ayutam-v${version}-windows-x64.zip"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $version = "${{ needs.verify.outputs.version }}"
          $src = (Resolve-Path build\windows\x64\runner\Release).Path
          New-Item -ItemType Directory -Force -Path dist\windows | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          & $iscc packaging\windows\ayutam.iss `
            "/DMyAppVersion=$version" `
            "/DMyAppSource=$src"
          Copy-Item "dist\windows\ayutam-v${version}-windows-x64-setup.exe" dist\
          Get-ChildItem dist
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/ayutam-*-windows-x64.zip
            dist/ayutam-*-windows-x64-setup.exe
          if-no-files-found: error

  release:
    needs: [verify, build-android, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Extract CHANGELOG section as release notes
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          {
            echo "## Install"
            echo ""
            echo "- **Android:** install the APK that matches your CPU — \`arm64-v8a\` for nearly all phones, \`armeabi-v7a\` for older 32-bit ARM, \`x86_64\` for most emulators. These are **release-mode** builds signed with the permanent Ayutam release certificate (ADR-021)."
            echo "- **Windows:** prefer \`ayutam-v${VERSION}-windows-x64-setup.exe\` (Inno Setup). Or unpack the portable \`.zip\` (exe + DLLs + \`data/\`) for no-admin / USB use."
            echo "- **Linux:** install the \`.deb\` on Debian/Ubuntu, or unpack the \`.tar.gz\` anywhere and run \`./ayutam\`."
            echo "- **Source:** GitHub attaches source \`.zip\` / \`.tar.gz\` automatically on this release."
            echo ""
            echo "## Changes"
            echo ""
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
              grab && /^## \[/ { exit }
              grab { print }
            ' CHANGELOG.md
          } > release-notes.md
          echo "--- notes ---"
          cat release-notes.md
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.verify.outputs.tag }}"
          VERSION="${{ needs.verify.outputs.version }}"
          mapfile -t files < <(find dist -type f \( \
            -name 'ayutam-*.apk' -o \
            -name 'ayutam-*.zip' -o \
            -name 'ayutam-*.exe' -o \
            -name 'ayutam-*.tar.gz' -o \
            -name 'ayutam-*.deb' \
          \) | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No Ayutam artifacts under dist/"
            exit 1
          fi
          echo "Found artifacts:"
          printf '  %s\n' "${files[@]}"
          basenames="$(printf '%s\n' "${files[@]}" | awk -F/ '{print $NF}' | sort)"
          expected=(
            "ayutam-v${VERSION}-android-armeabi-v7a.apk"
            "ayutam-v${VERSION}-android-arm64-v8a.apk"
            "ayutam-v${VERSION}-android-x86_64.apk"
            "ayutam-v${VERSION}-windows-x64.zip"
            "ayutam-v${VERSION}-windows-x64-setup.exe"
            "ayutam-v${VERSION}-linux-x64.tar.gz"
            "ayutam-v${VERSION}-linux-amd64.deb"
          )
          missing=0
          for name in "${expected[@]}"; do
            if ! grep -Fxq "$name" <<<"$basenames"; then
              echo "::error::Missing release asset ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} exists; uploading/replacing assets."
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --notes-file release-notes.md --title "Ayutam $TAG"
          else
            gh release create "$TAG" "${files[@]}" \
              --title "Ayutam $TAG" \
              --notes-file release-notes.md \
              --verify-tag
          fi
