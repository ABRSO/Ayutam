name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.7"

jobs:
  # Tag must match pubspec.yaml version and have a CHANGELOG section.
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Check tag against pubspec and CHANGELOG
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Releasing version: $VERSION"
          if ! grep -Eq "^version: ${VERSION}(\+[0-9]+)?$" pubspec.yaml; then
            echo "::error::pubspec.yaml version does not match tag v${VERSION}"
            exit 1
          fi
          if ! grep -q "## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test

  build-android:
    needs: [verify, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      # Release-mode AOT APKs, still debug-signed until a Play upload keystore
      # is configured (see android/app/build.gradle.kts). Same command as local
      # `flutter build apk --release --split-per-abi`.
      - run: flutter build apk --release --split-per-abi
      - name: Rename artifacts
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            "dist/ayutam-v${VERSION}-android-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "dist/ayutam-v${VERSION}-android-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
            "dist/ayutam-v${VERSION}-android-x86_64.apk"
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/ayutam-*.apk
          if-no-files-found: error

  build-linux:
    needs: [verify, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev dpkg-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build linux --release
      - name: Package tarball and .deb
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          mkdir -p dist/linux
          tar -czf "dist/linux/ayutam-v${VERSION}-linux-x64.tar.gz" \
            -C build/linux/x64/release/bundle .
          chmod +x tool/package_linux_deb.sh
          tool/package_linux_deb.sh "${VERSION}" build/linux/x64/release/bundle
          ls -la dist/linux
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dist/linux/ayutam-*.tar.gz
            dist/linux/ayutam-*.deb
          if-no-files-found: error

  build-windows:
    needs: [verify, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build windows --release
      - name: Portable zip
        shell: pwsh
        run: |
          $version = "${{ needs.verify.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath "dist\ayutam-v${version}-windows-x64.zip"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $version = "${{ needs.verify.outputs.version }}"
          $src = (Resolve-Path build\windows\x64\runner\Release).Path
          New-Item -ItemType Directory -Force -Path dist\windows | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          & $iscc packaging\windows\ayutam.iss `
            "/DMyAppVersion=$version" `
            "/DMyAppSource=$src"
          Copy-Item "dist\windows\ayutam-v${version}-windows-x64-setup.exe" dist\
          Get-ChildItem dist
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/ayutam-*-windows-x64.zip
            dist/ayutam-*-windows-x64-setup.exe
          if-no-files-found: error

  release:
    needs: [verify, build-android, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Extract CHANGELOG section as release notes
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          {
            echo "## Install"
            echo ""
            echo "- **Android:** install the APK that matches your CPU — \`arm64-v8a\` for nearly all phones, \`armeabi-v7a\` for older 32-bit ARM, \`x86_64\` for most emulators. These are **release-mode** builds (fast); they are still signed with the debug keystore until Play upload signing lands (Phase 8)."
            echo "- **Windows:** prefer \`ayutam-v${VERSION}-windows-x64-setup.exe\` (Inno Setup). Or unpack the portable \`.zip\` (exe + DLLs + \`data/\`) for no-admin / USB use."
            echo "- **Linux:** install the \`.deb\` on Debian/Ubuntu, or unpack the \`.tar.gz\` anywhere and run \`./ayutam\`."
            echo "- **Source:** GitHub attaches source \`.zip\` / \`.tar.gz\` automatically on this release."
            echo ""
            echo "## Changes"
            echo ""
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
              grab && /^## \[/ { exit }
              grab { print }
            ' CHANGELOG.md
          } > release-notes.md
          echo "--- notes ---"
          cat release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Ayutam $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
