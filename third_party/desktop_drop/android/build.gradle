group 'com.example.desktop_drop'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.2.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'

// Ayutam hosts AGP 9 with android.builtInKotlin=false (Flutter template).
// Upstream only skips kotlin-android when agpMajor >= 9, but still evaluates
// a kotlin {} block — that fails. Always apply KGP when built-in Kotlin is off.
def useBuiltInKotlin =
    (findProperty('android.builtInKotlin') ?: 'true').toString() != 'false'
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
if (!useBuiltInKotlin || agpMajor < 9) {
    apply plugin: 'kotlin-android'
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'one.mixin.desktop.drop'
    }

    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 16
    }
}

if (!useBuiltInKotlin || agpMajor < 9) {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
}
